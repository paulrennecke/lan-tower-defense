# Deploys LAN TD (online mode) to Uberspace.
#   every push, any branch  -> https://dev.td.rennecke.org   (latest push wins)
#   push to main            -> https://td.rennecke.org        (same build, after dev succeeded)
#
# Deployments are rolling: the new version starts next to the running one and only receives new visitors and new
# rooms; running rooms stay on their old instance until they are empty (see tools/deploy-remote.sh).
#
# Required repository secrets (same as the Adventskalender):
#   SFTP_HOST         Uberspace host, e.g. xyz.uberspace.de
#   SFTP_USERNAME     Uberspace user
#   SFTP_PRIVATE_KEY  private SSH key (the public key is in ~/.ssh/authorized_keys on Uberspace)
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   TD_REMOTE_ROOT / TD_DEV_REMOTE_ROOT   code directory relative to $HOME (default: lan-td / lan-td-dev)
#   TD_PORT / TD_DEV_PORT                 public router port; instances use the next 4 ports (default: 61235 / 61245)
#   TD_DOMAIN / TD_DEV_DOMAIN             domain (default: td.rennecke.org / dev.td.rennecke.org)
name: Deploy to Uberspace

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & tests
        run: |
          npm run typecheck
          npm test

      - name: Determine version
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then v="$base"; else v="$base-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Build client and LAN download package
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run build
          npm run package:lan

      - name: Install runtime dependencies
        run: |
          mkdir -p release
          cp -r dist server shared package.json package-lock.json tsconfig.json .npmrc release/
          cd release && npm ci --omit=dev --no-audit --no-fund

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release
            tools/deploy-remote.sh
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        # dev always, prod only for main (dev runs first and gates prod)
        target: ${{ fromJSON(github.ref == 'refs/heads/main' && '["dev","prod"]' || '["dev"]') }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
      HOST: ${{ secrets.SFTP_HOST }}
      USERNAME: ${{ secrets.SFTP_USERNAME }}
    steps:
      - name: Select target
        run: |
          if [ "${{ matrix.target }}" = "prod" ]; then
            echo "REMOTE_ROOT=${{ vars.TD_REMOTE_ROOT || 'lan-td' }}" >> "$GITHUB_ENV"
            echo "PORT=${{ vars.TD_PORT || '61235' }}" >> "$GITHUB_ENV"
            echo "DOMAIN=${{ vars.TD_DOMAIN || 'td.rennecke.org' }}" >> "$GITHUB_ENV"
            echo "EXTRA_DOMAIN=${{ vars.TD_EXTRA_DOMAIN || 'paul-rennecke.de' }}" >> "$GITHUB_ENV"
            echo "SERVICE=lan-td" >> "$GITHUB_ENV"
            echo "DATA_DIR=lan-td-data" >> "$GITHUB_ENV"
          else
            echo "REMOTE_ROOT=${{ vars.TD_DEV_REMOTE_ROOT || 'lan-td-dev' }}" >> "$GITHUB_ENV"
            echo "PORT=${{ vars.TD_DEV_PORT || '61245' }}" >> "$GITHUB_ENV"
            echo "DOMAIN=${{ vars.TD_DEV_DOMAIN || 'dev.td.rennecke.org' }}" >> "$GITHUB_ENV"
            echo "SERVICE=lan-td-dev" >> "$GITHUB_ENV"
            echo "DATA_DIR=lan-td-dev-data" >> "$GITHUB_ENV"
          fi
          echo "RELEASE=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Set up SSH key
        env:
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SFTP_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy"
          $SSH "$USERNAME@$HOST" "mkdir -p '$REMOTE_ROOT/releases/$RELEASE' '$DATA_DIR'"
          # Code only – persistent data (saves, highscores) lives in ~/$DATA_DIR and is never touched.
          rsync -az --delete -e "$SSH" release/ "$USERNAME@$HOST:$REMOTE_ROOT/releases/$RELEASE/"

      - name: Rolling deploy
        run: |
          ssh -i ~/.ssh/id_deploy "$USERNAME@$HOST" \
            "REMOTE_ROOT='$REMOTE_ROOT' SERVICE='$SERVICE' PORT='$PORT' DOMAIN='$DOMAIN' DATA_DIR='$DATA_DIR' RELEASE='$RELEASE' VERSION='$VERSION' EXTRA_ORIGINS='${EXTRA_DOMAIN:+https://$EXTRA_DOMAIN,https://www.$EXTRA_DOMAIN}' bash -s" \
            < tools/deploy-remote.sh

      - name: Configure web backend
        run: |
          ssh -i ~/.ssh/id_deploy "$USERNAME@$HOST" "uberspace web domain add $DOMAIN 2>/dev/null || true; uberspace web backend set $DOMAIN --http --port $PORT"

      - name: Configure path on extra domain (prod only)
        if: matrix.target == 'prod'
        run: |
          # https://<extra domain>/td/ -> same service. A missing domain must not fail the deployment.
          ssh -i ~/.ssh/id_deploy "$USERNAME@$HOST" "uberspace web backend set $EXTRA_DOMAIN/td --http --port $PORT --remove-prefix" || echo "::warning::Could not set backend for $EXTRA_DOMAIN/td"

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS "https://$DOMAIN/api/config" | grep -q "\"version\":\"$VERSION\""
          curl -fsSI "https://$DOMAIN/download/lan-td.zip" | head -n 1
          echo "✅ Deployed $VERSION: https://$DOMAIN"
