<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LAN TD – Promo 1:1</title>
<style>
  html, body { margin: 0; background: #050b18; }
  #poster { width: 1000px; height: 1000px; display: block; }
  text { font-family: Georgia, 'Times New Roman', serif; }
  .ui, .ui text { font-family: 'Segoe UI', 'Segoe UI Emoji', system-ui, sans-serif; }
</style>
</head>
<body>
<svg id="poster" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#27508a"/><stop offset="0.55" stop-color="#112447"/><stop offset="1" stop-color="#050b18"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset="0.5" stop-color="#f2c14e"/><stop offset="1" stop-color="#b9771d"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b18" stop-opacity="0"/><stop offset="0.45" stop-color="#050b18" stop-opacity="0.88"/><stop offset="1" stop-color="#050b18"/>
    </linearGradient>
    <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b18" stop-opacity="0.75"/><stop offset="1" stop-color="#050b18" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fieldclip"><rect x="0" y="225" width="1000" height="775"/></clipPath>
    <linearGradient id="imgfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1630"/><stop offset="1" stop-color="#0a1630" stop-opacity="0"/></linearGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.75"/></filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#sky)"/>
  <g id="aurora" filter="url(#blur40)" opacity="0.7">
    <ellipse cx="260" cy="170" rx="260" ry="55" fill="#2fe3a5" opacity="0.55" transform="rotate(-12 260 170)"/>
    <ellipse cx="700" cy="120" rx="300" ry="45" fill="#5b8cff" opacity="0.6" transform="rotate(8 700 120)"/>
    <ellipse cx="520" cy="230" rx="320" ry="40" fill="#b45bff" opacity="0.35" transform="rotate(-5 520 230)"/>
  </g>
  <g id="stars"></g>
  <image href="game-raw.png" x="-750" y="-311" width="2500" height="2500" preserveAspectRatio="none" clip-path="url(#fieldclip)"/>
  <rect x="0" y="225" width="1000" height="90" fill="url(#imgfade)"/>
  <g id="scene" display="none"></g>
  <g id="shots" display="none"></g>
  <g id="snow" display="none"></g>

  <rect x="0" y="0" width="1000" height="330" fill="url(#topfade)"/>
  <rect x="0" y="640" width="1000" height="360" fill="url(#band)"/>

  <g text-anchor="middle">
    <text x="500" y="150" font-size="118" font-weight="bold" fill="#0a1a38" stroke="#0a1a38" stroke-width="14" stroke-linejoin="round" opacity="0.9">LAN TD</text>
    <text x="500" y="150" font-size="118" font-weight="bold" fill="url(#gold)" stroke="#7a4a10" stroke-width="2" stroke-linejoin="round" filter="url(#glow)">LAN TD</text>
    <text x="500" y="204" font-size="31" fill="#dcecff" letter-spacing="1.5" font-style="italic">Kooperatives Maze-Tower-Defense</text>
  </g>

  <text x="170" y="140" font-size="76" fill="#cfeaff" filter="url(#glow)" text-anchor="middle">❄</text>
  <text x="830" y="140" font-size="76" fill="#cfeaff" filter="url(#glow)" text-anchor="middle">❄</text>
  <g id="chips" class="ui" text-anchor="middle" font-size="25" font-weight="600" fill="#eaf4ff"></g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
// deterministic random so the poster is reproducible
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// stars
const stars = document.getElementById('stars');
for (let i = 0; i < 110; i++) el('circle', { cx: rnd() * 1000, cy: rnd() * 420, r: 0.5 + rnd() * 1.5, fill: '#fff', opacity: 0.25 + rnd() * 0.6 }, stars);

// ---- isometric scene ---------------------------------------------------
const N = 11, TW = 64, TH = 32, OX = 500, OY = 395;
const iso = (gx, gy, z = 0) => [OX + (gx - gy) * TW / 2, OY + (gx + gy) * TH / 2 - z];
const pts = (a) => a.map((p) => p.join(',')).join(' ');
const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.max(0, Math.min(255, Math.round(v * f))));
  return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
};

// lane: spawn at the top left, gate at the bottom right
const path = [];
const line = (x0, y0, x1, y1) => {
  const dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0);
  let x = x0, y = y0;
  for (;;) { path.push([x, y]); if (x === x1 && y === y1) break; x += dx; y += dy; }
};
line(0, 1, 9, 1); line(9, 2, 9, 3); line(8, 3, 1, 3); line(1, 4, 1, 5); line(2, 5, 9, 5);
line(9, 6, 9, 7); line(8, 7, 1, 7); line(1, 8, 1, 9); line(2, 9, 10, 9);
const pathSet = new Set(path.map((p) => p.join(',')));
const isPath = (x, y) => pathSet.has(x + ',' + y);

const items = []; // {depth, draw()}
const scene = document.getElementById('scene');
const g = el('g', {}, scene);
const diamond = (gx, gy, z, color, parent, extra = {}) =>
  el('polygon', { points: pts([iso(gx, gy, z), iso(gx + 1, gy, z), iso(gx + 1, gy + 1, z), iso(gx, gy + 1, z)]), fill: color, ...extra }, parent);

// ground slab with thickness
const slab = el('g', {}, g);
el('polygon', { points: pts([iso(0, N, 0), iso(N, N, 0), iso(N, N, -22), iso(0, N, -22)]), fill: '#9bb7d1' }, slab);
el('polygon', { points: pts([iso(N, 0, 0), iso(N, N, 0), iso(N, N, -22), iso(N, 0, -22)]), fill: '#7d9ab8' }, slab);
for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
  const path_ = isPath(x, y);
  const base = path_ ? '#8fcaf2' : ((x + y) % 2 ? '#eef5fc' : '#e2edf8');
  diamond(x, y, 0, base, slab, { stroke: path_ ? '#6fb3e0' : '#cfdfee', 'stroke-width': 1 });
}
// glowing creep lane
const lane = path.map(([x, y]) => iso(x + 0.5, y + 0.5, 1));
el('polyline', { points: pts(lane), fill: 'none', stroke: '#7fe0ff', 'stroke-width': 10, 'stroke-linejoin': 'round', opacity: 0.35, filter: 'url(#blur8)' }, slab);
el('polyline', { points: pts(lane), fill: 'none', stroke: '#d9f6ff', 'stroke-width': 3, 'stroke-dasharray': '2 9', 'stroke-linecap': 'round', opacity: 0.9 }, slab);

const cube = (parent, gx, gy, z, size, h, color, inset = 0) => {
  const a = gx + inset, b = gy + inset, s = size - inset * 2;
  const grp = el('g', {}, parent);
  el('polygon', { points: pts([iso(a, b + s, z), iso(a + s, b + s, z), iso(a + s, b + s, z + h), iso(a, b + s, z + h)]), fill: shade(color, 0.78) }, grp);
  el('polygon', { points: pts([iso(a + s, b, z), iso(a + s, b + s, z), iso(a + s, b + s, z + h), iso(a + s, b, z + h)]), fill: shade(color, 0.58) }, grp);
  el('polygon', { points: pts([iso(a, b, z + h), iso(a + s, b, z + h), iso(a + s, b + s, z + h), iso(a, b + s, z + h)]), fill: color }, grp);
  return grp;
};

const classes = ['#3b6fd6', '#c0392b', '#9b59d6', '#1abc9c', '#e67e22', '#f1c40f'];
const towers = []; // for projectiles
const objects = [];
let ci = 0;
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  if (isPath(x, y)) continue;
  const gap = [2, 4, 6, 8].includes(y) && x >= 1 && x <= 9;
  if (!gap) {
    // border: a few snowy rocks and pines
    if ((x + y * 3) % 5 === 0) objects.push({ d: x + y, type: 'pine', x, y });
    continue;
  }
  const slot = (x + y) % 3;
  if (x % 2 === 1 && [2, 4, 6, 8].includes(y) && rnd() < 0.62) {
    const color = classes[ci++ % classes.length];
    objects.push({ d: x + y, type: 'tower', x, y, color });
    towers.push({ x, y, color });
  } else if (slot !== 0 || rnd() < 0.5) objects.push({ d: x + y, type: 'wall', x, y });
}

// enemies on the lane
const enemyIdx = [3, 7, 10, 13, 20, 24, 27, 33, 38, 44, 49, 53];
const enemies = enemyIdx.filter((i) => i < path.length).map((i, k) => ({ d: path[i][0] + path[i][1] + 0.5, type: 'enemy', x: path[i][0], y: path[i][1], k }));
objects.push(...enemies);
// portals
objects.push({ d: -1, type: 'portal', x: 0, y: 1, color: '#c040ff' });
objects.push({ d: 19, type: 'portal', x: 10, y: 9, color: '#4fc3ff' });
objects.sort((a, b) => a.d - b.d || a.y - b.y);

const drawTower = (o, parent) => {
  const gr = el('g', {}, parent);
  cube(gr, o.x, o.y, 0, 1, 14, '#8a93a3', 0.08);
  cube(gr, o.x, o.y, 14, 1, 30, o.color, 0.26);
  const [cx, cy] = iso(o.x + 0.5, o.y + 0.5, 62);
  el('circle', { cx, cy, r: 22, fill: o.color, opacity: 0.55, filter: 'url(#blur8)' }, gr);
  el('circle', { cx, cy, r: 9, fill: '#fff', opacity: 0.95 }, gr);
  el('circle', { cx, cy, r: 13, fill: 'none', stroke: o.color, 'stroke-width': 3, opacity: 0.9 }, gr);
  o.top = [cx, cy];
  return gr;
};

for (const o of objects) {
  if (o.type === 'wall') cube(g, o.x, o.y, 0, 1, 16, '#7f94ad', 0.04), el('polygon', { points: pts([iso(o.x + 0.04, o.y + 0.04, 17), iso(o.x + 0.96, o.y + 0.04, 17), iso(o.x + 0.96, o.y + 0.5, 17), iso(o.x + 0.04, o.y + 0.5, 17)]), fill: '#ffffff', opacity: 0.55 }, g);
  else if (o.type === 'tower') drawTower(o, g);
  else if (o.type === 'pine') {
    const [px, py] = iso(o.x + 0.5, o.y + 0.5, 0);
    const gr = el('g', {}, g);
    el('ellipse', { cx: px, cy: py + 2, rx: 14, ry: 6, fill: '#000', opacity: 0.18 }, gr);
    for (let i = 0; i < 3; i++) el('polygon', { points: `${px},${py - 62 + i * 15} ${px - 22 + i * 3},${py - 22 + i * 12} ${px + 22 - i * 3},${py - 22 + i * 12}`, fill: ['#2f7d58', '#27694a', '#1f5a3f'][i] }, gr);
    el('polygon', { points: `${px},${py - 62} ${px - 8},${py - 46} ${px + 8},${py - 46}`, fill: '#fff', opacity: 0.85 }, gr);
  } else if (o.type === 'portal') {
    const [px, py] = iso(o.x + 0.5, o.y + 0.5, 0);
    const gr = el('g', {}, g);
    el('ellipse', { cx: px, cy: py - 24, rx: 40, ry: 52, fill: o.color, opacity: 0.45, filter: 'url(#blur8)' }, gr);
    el('ellipse', { cx: px, cy: py - 26, rx: 22, ry: 36, fill: 'none', stroke: o.color, 'stroke-width': 8 }, gr);
    el('ellipse', { cx: px, cy: py - 26, rx: 14, ry: 28, fill: '#fff', opacity: 0.55 }, gr);
  } else if (o.type === 'enemy') {
    const [px, py] = iso(o.x + 0.5, o.y + 0.5, 0);
    const col = ['#8e3dd1', '#d64541', '#3fa36b'][o.k % 3];
    const gr = el('g', {}, g);
    el('ellipse', { cx: px, cy: py + 2, rx: 12, ry: 5, fill: '#000', opacity: 0.3 }, gr);
    el('ellipse', { cx: px, cy: py - 11, rx: 11, ry: 13, fill: col }, gr);
    el('ellipse', { cx: px - 3, cy: py - 17, rx: 4, ry: 5, fill: '#fff', opacity: 0.25 }, gr);
    el('circle', { cx: px - 4, cy: py - 12, r: 2.4, fill: '#ffe45e' }, gr);
    el('circle', { cx: px + 4, cy: py - 12, r: 2.4, fill: '#ffe45e' }, gr);
    el('rect', { x: px - 10, y: py - 32, width: 20, height: 4, rx: 2, fill: '#222' }, gr);
    el('rect', { x: px - 10, y: py - 32, width: 20 * (0.45 + 0.5 * ((o.k * 37) % 10) / 10), height: 4, rx: 2, fill: '#5be06b' }, gr);
    o.pos = [px, py - 12];
  }
}

// projectiles / beams from towers to the nearest enemy
const shots = document.getElementById('shots');
for (const t of towers) {
  const o = objects.find((q) => q.type === 'tower' && q.x === t.x && q.y === t.y);
  if (!o.top) continue;
  let best = null, bd = 1e9;
  for (const e of enemies) {
    if (!e.pos) continue;
    const d = Math.hypot(e.pos[0] - o.top[0], e.pos[1] - o.top[1]);
    if (d < bd) { bd = d; best = e; }
  }
  if (!best || bd > 260) continue;
  const [x1, y1] = o.top, [x2, y2] = best.pos;
  const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 22;
  el('path', { d: `M${x1},${y1} Q${mx},${my} ${x2},${y2}`, fill: 'none', stroke: o.color, 'stroke-width': 7, 'stroke-linecap': 'round', opacity: 0.45, filter: 'url(#blur3)' }, shots);
  el('path', { d: `M${x1},${y1} Q${mx},${my} ${x2},${y2}`, fill: 'none', stroke: '#fff', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-dasharray': '10 8' }, shots);
  const t05 = 0.62, px = (1 - t05) * (1 - t05) * x1 + 2 * (1 - t05) * t05 * mx + t05 * t05 * x2, py = (1 - t05) * (1 - t05) * y1 + 2 * (1 - t05) * t05 * my + t05 * t05 * y2;
  el('circle', { cx: px, cy: py, r: 6, fill: '#fff', filter: 'url(#glow)' }, shots);
  el('circle', { cx: x2, cy: y2, r: 14, fill: o.color, opacity: 0.5, filter: 'url(#blur8)' }, shots);
}

// snow
const snow = document.getElementById('snow');
for (let i = 0; i < 90; i++) el('circle', { cx: rnd() * 1000, cy: rnd() * 1000, r: 1 + rnd() * 3, fill: '#fff', opacity: 0.25 + rnd() * 0.6 }, snow);

// feature chips
const chips = document.getElementById('chips');
const feats = [['🌐', 'Online-Räume'], ['🖧', 'LAN-Party'], ['👥', 'Bis zu 16 Spieler'], ['⚔', '40 Wellen & Endlos']];
const cw = 330, gap = 18, ch = 70;
feats.forEach(([icon, label], i) => {
  const x = 500 - cw - gap / 2 + (i % 2) * (cw + gap), y = 790 + Math.floor(i / 2) * (ch + 18);
  el('rect', { x, y, width: cw, height: ch, rx: 35, fill: '#0b1d3a', 'fill-opacity': 0.9, stroke: '#f2c14e', 'stroke-opacity': 0.85, 'stroke-width': 2.5 }, chips);
  const t = el('text', { x: x + cw / 2, y: y + 46, 'font-size': 29 }, chips); t.textContent = icon + ' ' + label;
});
</script>
</body>
</html>
